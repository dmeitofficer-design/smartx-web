<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartX Technology Limited</title>
<script>
const targetUrl = "https://smartx-web.vercel.app";

// 1. Start fetching the target page in the background
fetch(targetUrl, { mode: 'no-cors' }) 
    .then(() => {
        // 2. The moment the server responds, send the user there instantly
        window.location.href = targetUrl;
    })
    .catch((error) => {
        console.error("Failed to pre-load link:", error);
        // Fallback: If the network fails, redirect anyway after a short safety delay
        setTimeout(() => {
            window.location.href = targetUrl;
        }, 3000);
    });
</script>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.loading-screen {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    background: #ffffff;
}

.logo-container {
    width: min(90vw, 420px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

.logo-wrapper {
    position: relative;
    width: 100%;
}

.logo,
.logo-fill {
    width: 100%;
}

.logo svg,
.logo-fill svg {
    width: 100%;
    height: auto;
    display: block;
}

/* FIX: Force BOTH fill and stroke attributes to the background color for ALL elements */
.logo svg * {
    fill: #dbe4f0 !important;
    stroke: #dbe4f0 !important;
}

/* Explicitly catch lines/shapes that shouldn't show a white background before fill */
.logo svg .cls-9 {
    fill: #dbe4f0 !important;
}

.logo-fill {
    position: absolute;
    inset: 0;
    overflow: hidden;
    animation: fillLogo 2.8s ease-in-out forwards;
}

.logo-fill svg * {
    filter: none !important;
}

.progress {
    width: 100%;
    height: 1vh;
    
    background: #eef2f7;
    overflow: hidden;
    position: absolute;
    top: 10px;
}

.progress-bar {
    height: 100%;
    width: 100%;
    transform-origin: left;
    transform: scaleX(0);

    background: linear-gradient(
        90deg,
        #0d6efd 0%,
        #ff3298 40%,
        #ff0000 70%,
        #ff7300 100%
    );
    animation: progressFill 2.8s ease-in-out forwards;
}

.loading-text {
    color: #4b5563;
    font-size: 14px;
    letter-spacing: .08em;
    text-transform: uppercase;
}

@keyframes fillLogo {
    from {
        clip-path: inset(100% 0 0 0);
    }
    to {
        clip-path: inset(0 0 0 0);
    }
}

@keyframes progressFill {
    from {
        transform: scaleX(0);
    }
    to {
        transform: scaleX(1);
    }
}

@media (max-width: 600px) {
    .logo-container {
        width: min(92vw, 320px);
    }
}
</style>
</head>
